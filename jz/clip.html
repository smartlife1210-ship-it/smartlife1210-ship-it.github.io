<!doctype html><meta charset=utf-8><title>clip</title>
<body style="background:#222;color:#fff;font:20px sans-serif">
<button id=b style="font-size:28px;padding:30px 60px">COPY</button><div id=s>ready</div>
<script>
const f=new URLSearchParams(location.search).get('f');
document.getElementById('b').onclick=async()=>{try{
 const blobP=(async()=>{const r=await fetch(f);const bl=await r.blob();const im=await createImageBitmap(bl);const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);return await new Promise(res=>c.toBlob(res,'image/png'));})();
 await navigator.clipboard.write([new ClipboardItem({'image/png':blobP})]);
 document.getElementById('s').textContent='copied '+f;
}catch(e){document.getElementById('s').textContent='err '+e}};
</script>
